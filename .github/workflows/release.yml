name: Release

# Tag-driven release pipeline:
#  - a signed AAB (+ mapping.txt for Play deobfuscation) built from the tag
#  - the backend Docker image pushed to the registry (when configured)
# Signing secrets (set in the repo): CIRRUS_KEYSTORE_BASE64,
# CIRRUS_KEYSTORE_PASSWORD, CIRRUS_KEY_ALIAS, CIRRUS_KEY_PASSWORD.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release entry

jobs:
  android:
    name: Android — signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing keystore
        if: env.CIRRUS_KEYSTORE_BASE64 != ''
        run: |
          echo "${CIRRUS_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "CIRRUS_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
        env:
          CIRRUS_KEYSTORE_BASE64: ${{ secrets.CIRRUS_KEYSTORE_BASE64 }}
      - name: Derive version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Build release bundle
        run: >
          ./gradlew :app:bundleRelease
          -PapiBaseUrl="${{ vars.RELEASE_API_BASE_URL }}"
          -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
        env:
          CIRRUS_KEYSTORE_PASSWORD: ${{ secrets.CIRRUS_KEYSTORE_PASSWORD }}
          CIRRUS_KEY_ALIAS: ${{ secrets.CIRRUS_KEY_ALIAS }}
          CIRRUS_KEY_PASSWORD: ${{ secrets.CIRRUS_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: cirrus-release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true

  backend-docker:
    name: Backend — Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (push only when registry secrets exist)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ vars.DOCKER_REGISTRY != '' }}
          tags: ${{ vars.DOCKER_REGISTRY != '' && format('{0}/cirrus-backend:latest', vars.DOCKER_REGISTRY) || 'cirrus-backend:local' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
