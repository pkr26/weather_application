name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: a full Stryker pass per push is
# expensive, and only the newest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, scoped per job: the backend job is read-only; the android
# job needs contents:write solely for the dependency-graph submission API.
jobs:
  backend:
    name: Backend — typecheck · test · mutation · audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (per-file coverage gate at 98%)
        run: npm run test:coverage
      - name: Mutation testing (Stryker — gate at 98% of scored mutants)
        run: npm run mutation
      - name: Dependency audit (fails on moderate+)
        run: npm run audit

  android:
    name: Android — tests · mutation · lint · debug+release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # contents:write is required by the dependency-graph submission below
    # (GitHub Dependency Submission API); everything else stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: "Validate Gradle wrapper (supply-chain: the jar runs on every build)"
        uses: gradle/actions/wrapper-validation-action@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0
        with:
          dependency-graph: generate-and-submit
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Mutation testing (PIT — gate at 98% score)
        run: ./gradlew :core:pitest
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      # The minified release build is the one users get — R8/serialization
      # keep-rule breakage only shows up at runtime, so build it every push.
      - name: Assemble release (R8 smoke build, debug-signed)
        run: ./gradlew :app:assembleRelease -PapiBaseUrl=https://ci.example.invalid/api/v1/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cirrus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
