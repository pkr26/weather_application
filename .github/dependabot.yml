version: 2
updates:
  # Gradle / Android dependencies (version catalog + build files)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Backend npm dependencies
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Backend base images (node:22-alpine)
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  # GitHub Actions (CI/workflows)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
